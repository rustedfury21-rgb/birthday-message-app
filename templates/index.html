<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Message 🎂</title>


    <style>
        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 24px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(135deg,
                    #fff1f7,
                    #eef5ff);

            color: #252331;
        }


        .card {

            width: 100%;

            max-width: 560px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 28px;

            padding: 35px;

            box-shadow:
                0 20px 60px rgba(50, 50, 90, 0.14);
        }


        .birthday-icon {

            text-align: center;

            font-size: 58px;

            margin-bottom: 8px;
        }


        h1 {

            text-align: center;

            font-size: 32px;

            margin:
                0 0 10px;
        }


        .subtitle {

            text-align: center;

            color: #777481;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        label {

            display: block;

            font-weight: 700;

            margin-bottom: 8px;

            margin-top: 20px;
        }


        input,
        textarea {

            width: 100%;

            border: 1px solid #dedde6;

            border-radius: 14px;

            padding: 14px 15px;

            font-family: inherit;

            font-size: 16px;

            outline: none;

            background: white;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        input:focus,
        textarea:focus {

            border-color: #7968ff;

            box-shadow:
                0 0 0 4px rgba(121, 104, 255, 0.12);
        }


        textarea {

            min-height: 180px;

            resize: vertical;
        }


        .error {

            background: #fff0f0;

            color: #b42318;

            border-radius: 12px;

            padding: 12px 14px;

            margin-bottom: 15px;

            font-size: 14px;
        }


        button {

            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 16px;

            margin-top: 22px;

            background: #7160ff;

            color: white;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.15s,
                filter 0.15s;
        }


        button:hover {

            filter: brightness(0.95);

            transform: translateY(-1px);
        }


        button:active {

            transform: translateY(0);
        }


        .footer {

            text-align: center;

            color: #aaa7b0;

            font-size: 12px;

            margin-top: 20px;
        }
    </style>

</head>


<body>


    <main class="card">


        <div class="birthday-icon">
            🎂
        </div>


        <h1>
            It's my birthday!
        </h1>


        <p class="subtitle">

            Do you have a message for me?

            <br>

            It can be literally anything. 💌

        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">


            <label for="name">
                Your name
            </label>


            <input id="name" name="name" type="text" maxlength="80" placeholder="e.g. Alex" required>


            <label for="message">
                Your message
            </label>


            <textarea id="message" name="message" maxlength="2000" placeholder="Write whatever you want to say..."
                required></textarea>


            <button type="submit">

                Send Birthday Message 🎉

            </button>


        </form>


        <div class="footer">

            Thank you for taking the time to write something! ❤️

        </div>


    </main>


</body>

</html>
